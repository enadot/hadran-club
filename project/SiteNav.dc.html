<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/tokens/colors.css">
  <link rel="stylesheet" href="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/tokens/typography.css">
  <link rel="stylesheet" href="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/tokens/radius.css">
  <link rel="stylesheet" href="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/tokens/elevation.css">
  <link rel="stylesheet" href="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/tokens/motion.css">
  <link rel="stylesheet" href="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/tokens/base.css">
  <link rel="stylesheet" href="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/styles.css">
  <script src="_ds/hadran-club-design-system-16539e69-76f9-4f08-9982-e9f8edf44e80/_ds_bundle.js"></script>
  <style>
    @keyframes hcDrawerIn { from { transform: translateX(102%) } to { transform: none } }
    @keyframes hcScrimIn { from { opacity: 0 } to { opacity: 1 } }
    header > div > nav a { white-space: nowrap }
    @media (prefers-reduced-motion: reduce) { .hc-drawer, .hc-drawer-scrim { animation: none !important } }
  </style>
</helmet>

<sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
  <x-import component-from-global-scope="HadranClubDesignSystem_16539e.NavBar" logo-src="{{ logoSrc }}" links="{{ links }}" active="{{ active }}" cta="{{ cta }}" on-cta-click="{{ onCtaClick }}" hint-size="100%,86px"></x-import>
</sc-if>

<sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
  <header style="position:sticky;top:0;z-index:40;background:var(--color-canvas);border-bottom:1px solid var(--color-border);font-family:var(--font-ui)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px">
      <a href="Home.dc.html" style="display:flex;align-items:center;text-decoration:none">
        <img src="assets/logo-lockup.svg" alt="הדרן קלאב" style="height:32px">
      </a>
      <div style="display:flex;align-items:center;gap:8px">
        <a href="Search.dc.html" aria-label="חיפוש" style="width:44px;height:44px;border-radius:9999px;display:grid;place-items:center;color:var(--color-ink);text-decoration:none">
          <x-import component-from-global-scope="HadranClubDesignSystem_16539e.Icon" name="search" size="{{ 22 }}" hint-size="22px,22px"></x-import>
        </a>
        <button onClick="{{ toggle }}" aria-label="תפריט" aria-expanded="{{ openStr }}" style="width:44px;height:44px;border-radius:9999px;border:1px solid var(--color-border);background:var(--color-canvas);color:var(--color-ink);display:grid;place-items:center;cursor:pointer;transition:var(--transition-base)" style-hover="background:var(--color-canvas-soft)">
          <x-import component-from-global-scope="HadranClubDesignSystem_16539e.Icon" name="{{ burgerIcon }}" size="{{ 24 }}" hint-size="24px,24px"></x-import>
        </button>
      </div>
    </div>
  </header>

  <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ false }}">
    <div class="hc-drawer-scrim" onClick="{{ close }}" style="position:fixed;inset:0;background:rgba(18,16,11,.45);z-index:70;animation:hcScrimIn 200ms cubic-bezier(.2,.8,.2,1)"></div>
    <aside class="hc-drawer" role="dialog" aria-modal="true" aria-label="תפריט האתר" style="position:fixed;inset-block:0;inset-inline-start:0;z-index:71;width:min(86vw,340px);background:var(--color-canvas);box-shadow:var(--shadow-overlay);display:flex;flex-direction:column;font-family:var(--font-ui);animation:hcDrawerIn 240ms cubic-bezier(.2,.8,.2,1)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--color-border)">
        <img src="assets/logo-lockup.svg" alt="הדרן קלאב" style="height:32px">
        <button onClick="{{ close }}" aria-label="סגירת התפריט" style="width:44px;height:44px;border-radius:9999px;border:1px solid var(--color-border);background:var(--color-canvas);color:var(--color-ink);display:grid;place-items:center;cursor:pointer">
          <x-import component-from-global-scope="HadranClubDesignSystem_16539e.Icon" name="x" size="{{ 22 }}" hint-size="22px,22px"></x-import>
        </button>
      </div>

      <nav style="flex:1;overflow-y:auto;padding:8px 0">
        <sc-for list="{{ navItems }}" as="l" hint-placeholder-count="7">
          <a href="{{ l.href }}" style="display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 18px;text-decoration:none;color:var(--color-ink);font-size:18px;font-weight:{{ l.weight }};border-inline-start:3px solid {{ l.bar }};background:{{ l.bg }}">
            <span style="flex:none;width:36px;height:36px;border-radius:9999px;background:var(--color-canvas-soft);display:grid;place-items:center;color:var(--color-primary-deep)">
              <x-import component-from-global-scope="HadranClubDesignSystem_16539e.Icon" name="{{ l.icon }}" size="{{ 20 }}" hint-size="20px,20px"></x-import>
            </span>
            <span style="flex:1">{{ l.label }}</span>
            <x-import component-from-global-scope="HadranClubDesignSystem_16539e.Icon" name="chevron-left" size="{{ 18 }}" color="var(--color-mute)" hint-size="18px,18px"></x-import>
          </a>
        </sc-for>
      </nav>

      <div style="display:flex;flex-direction:column;gap:12px;padding:18px;border-top:1px solid var(--color-border);background:var(--color-canvas-soft)">
        <sc-if value="{{ hasCta }}" hint-placeholder-val="{{ true }}">
          <x-import component-from-global-scope="HadranClubDesignSystem_16539e.Button" size="lg" full-width="{{ true }}" on-click="{{ ctaClick }}" hint-size="100%,52px">{{ cta }}</x-import>
        </sc-if>
        <a href="tel:0300000000" style="display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;font-size:15px;font-weight:600;color:var(--color-primary-deep);text-decoration:none">
          <x-import component-from-global-scope="HadranClubDesignSystem_16539e.Icon" name="phone" size="{{ 18 }}" hint-size="18px,18px"></x-import>
          <span class="tnum" style="direction:ltr">03-000-0000</span>
        </a>
        <span style="font-size:12px;color:var(--color-mute);text-align:center">שירות הלקוחות · א׳–ה׳ 9:00–17:00</span>
      </div>
    </aside>
  </sc-if>
</sc-if>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:600},&quot;logoSrc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/logo-lockup.svg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;links&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string;href?:string}[]&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;דף הבית&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;להצטרפות&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onCtaClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const ICONS = {
  'דף הבית': 'home', 'בתי העסק': 'store', 'לבתי עסק': 'store', 'הפעלת כרטיס': 'credit-card',
  'בדיקת יתרה': 'wallet', 'שאלות ותשובות': 'help-circle', 'אזור אישי': 'user', 'חיפוש': 'search',
};

class Component extends DCLogic {
  state = { open: false, desktop: true };

  componentDidMount() {
    this.mq = window.matchMedia('(min-width: 1060px)');
    this.sync = () => this.setState({ desktop: this.mq.matches, open: false });
    this.mq.addEventListener('change', this.sync);
    this.setState({ desktop: this.mq.matches });
    this.onKey = (e) => { if (e.key === 'Escape' && this.state.open) this.setState({ open: false }); };
    window.addEventListener('keydown', this.onKey);
  }
  componentDidUpdate() {
    document.body.style.overflow = this.state.open ? 'hidden' : '';
  }
  componentWillUnmount() {
    if (this.mq) this.mq.removeEventListener('change', this.sync);
    window.removeEventListener('keydown', this.onKey);
    document.body.style.overflow = '';
  }

  renderVals() {
    const links = this.props.links || [];
    const active = this.props.active;
    const open = this.state.open;
    return {
      logoSrc: this.props.logoSrc || 'assets/logo-lockup.svg',
      links, active,
      cta: this.props.cta,
      hasCta: !!this.props.cta,
      onCtaClick: this.props.onCtaClick,
      ctaClick: () => { this.setState({ open: false }); if (this.props.onCtaClick) this.props.onCtaClick(); },
      isDesktop: this.state.desktop,
      isMobile: !this.state.desktop,
      isOpen: open,
      openStr: open ? 'true' : 'false',
      burgerIcon: open ? 'x' : 'menu',
      navItems: links.map((l) => ({
        label: l.label,
        href: l.href || '#',
        icon: ICONS[l.label] || 'chevron-left',
        weight: l.label === active ? 700 : 500,
        bar: l.label === active ? 'var(--color-primary)' : 'transparent',
        bg: l.label === active ? 'var(--color-canvas-soft)' : 'transparent',
      })),
      toggle: () => this.setState((s) => ({ open: !s.open })),
      close: () => this.setState({ open: false }),
    };
  }
}

</script>
</body>
</html>
